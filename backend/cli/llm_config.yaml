# LLM Configuration for Vehicle Diagnosis CLI
# 
# 配置公司内部LLM网关

# Provider: litellm (支持OpenAI兼容API)
provider: litellm

# LLM Gateway endpoint
custom_endpoint: "https://llm-gateway.dev.cn-vwa.volkswagen-cea.com/v1/chat/completions"

# API key (从环境变量读取，或在此处设置)
# 建议使用环境变量: LLM_CUSTOM_API_KEY
custom_api_key: ""

# 可选模型列表 (来自 opencode.json 配置)
available_models:
  - name: "GLM-5-FP8"
    description: "GLM-5 FP8 模型 - 平衡性能与速度"
  - name: "MiniMax"
    description: "MiniMax 模型 - 快速响应"
  - name: "MiniMax-M2.5"
    description: "MiniMax M2.5 - 增强版"
  - name: "MiniMax-M2.1"
    description: "MiniMax M2.1 - 稳定版"

# 默认模型
model: "GLM-5-FP8"

# 模型参数
temperature: 0.7
max_tokens: 4096

# 请求配置
timeout: 120          # 秒
max_retries: 3
retry_delay: 1.0      # 秒

# 功能开关
enable_streaming: false
enable_fallback: true
log_requests: true
