# LLM Configuration for Vehicle Diagnosis CLI
# 
# 支持两种模式:
# 1. OpenRouter (推荐): 使用 openrouter.ai 的远程 LLM
# 2. Custom (内部): 使用公司内部 LLM 网关

# Provider: openrouter 或 litellm
# 推荐使用 openrouter，需要设置环境变量 LLM_OPENROUTER_API_KEY
provider: "openrouter"

# === OpenRouter 配置 (当 provider=openrouter 时) ===
# 环境变量: LLM_OPENROUTER_API_KEY
# 默认模型: openai/gpt-3.5-turbo
openrouter_model: "openai/gpt-3.5-turbo"

# === Custom LLM Gateway 配置 (当 provider=litellm 时) ===
custom_endpoint: "https://llm-gateway.dev.cn-vwa.volkswagen-cea.com/v1/chat/completions"
custom_api_key: ""

# 可选模型列表
available_models:
  - name: "GLM-5-FP8"
    description: "GLM-5 FP8 模型 - 内部网关"
  - name: "openai/gpt-3.5-turbo"
    description: "GPT-3.5 Turbo - OpenRouter"
  - name: "openai/gpt-4"
    description: "GPT-4 - OpenRouter"

# 默认模型
model: "openai/gpt-3.5-turbo"

# 模型参数
temperature: 0.7
max_tokens: 4096

# 请求配置
timeout: 120          # 秒
max_retries: 3
retry_delay: 1.0      # 秒

# 功能开关
enable_streaming: false
enable_fallback: true
log_requests: true
